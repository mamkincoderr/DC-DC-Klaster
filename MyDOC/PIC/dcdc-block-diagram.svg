<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dcdc-block-title dcdc-block-desc">
      <title id="dcdc-block-title">Структурная схема DAB-преобразователя ДЦ-ДД-001</title>
      <desc id="dcdc-block-desc">Блок-схема силовой части (мост ВВ — трансформатор — сдвоенный мост НВ) и части управления (контроллер CH32V303, гальваническая изоляция, CAN-трансивер, вспомогательное питание) двунаправленного изолирующего DC-DC преобразователя.</desc>
      <defs><style>@import url(&apos;https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap&apos;);</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONES (bg, before arrows/nodes) ===== -->
      <rect x="40" y="40" width="1080" height="180" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="44" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="124" y="53" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">СИЛОВАЯ ЧАСТЬ · ДАБ</text>

      <rect x="40" y="380" width="1080" height="180" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="384" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="104" y="393" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">УПРАВЛЕНИЕ</text>

      <!-- ===== ARROWS (before nodes) ===== -->

      <!-- 1. HV мост <-> Трансформатор (power, bidirectional) -->
      <line x1="284" y1="132" x2="480" y2="132" stroke="#4f5d75" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="364" y="112" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="382" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P</text>

      <!-- 2. Трансформатор <-> LV мост (power, bidirectional) -->
      <line x1="640" y1="132" x2="836" y2="132" stroke="#4f5d75" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="720" y="112" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="738" y="121" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">P</text>

      <!-- 3. MCU <-> HV мост (control + sense, dashed, bidirectional) — straight vertical, shared x=200 -->
      <line x1="200" y1="188" x2="200" y2="404" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="4,3" marker-start="url(#arrow-soft)" marker-end="url(#arrow-soft)"/>
      <rect x="206" y="288" width="108" height="24" rx="2" fill="#f5f5f5"/>
      <text x="212" y="298" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">ШИМ /</text>
      <text x="212" y="309" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">Uсети 2М/2М</text>

      <!-- 4. MCU -> LV мост (control, dashed, one-way): (340,404) up to (340,204) right to (900,204) up to (900,188) -->
      <path d="M 340,404 V 212 Q 340,204 348,204 H 892 Q 900,204 900,196 V 188"
            fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
      <rect x="586" y="184" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="630" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ШИМ, 0–10В</text>

      <!-- 5. MCU <-> Изолятор (data, bidirectional) -->
      <line x1="376" y1="470" x2="560" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="440" y="450" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="459" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ДАННЫЕ</text>

      <!-- 6. Изолятор <-> CAN-трансивер (bidirectional) -->
      <line x1="720" y1="470" x2="836" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <rect x="726" y="450" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="778" y="459" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">CAN 1 МБИТ/С</text>

      <!-- 7. LV мост -> Вспом. питание (power, one-way) — straight vertical, shared x=958 -->
      <line x1="958" y1="188" x2="958" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="964" y="218" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="992" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">42–58 В</text>

      <!-- 8. Вспом. питание -> MCU (power, one-way), with hop over connector #4 at x=340,y=364 -->
      <path d="M 958,348 V 356 Q 958,364 950,364 H 348 a 8,8 0 0,1 -16,0 H 284 Q 276,364 276,372 V 404"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="580" y="352" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">3.3 В</text>

      <!-- ===== NODES ===== -->

      <!-- HV мост -->
      <rect x="64" y="76" width="220" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="76" width="220" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="82" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="88" y="91" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PWR</text>
      <text x="174" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HV мост</text>
      <text x="174" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4×MOSFET, TLP155×4</text>
      <text x="174" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">360–430 В DC</text>

      <!-- Трансформатор -->
      <rect x="480" y="76" width="160" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="480" y="76" width="160" height="112" rx="6" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
      <rect x="488" y="82" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="504" y="91" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ISO</text>
      <text x="560" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Трансформатор</text>
      <text x="560" y="150" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">гальваническая</text>
      <text x="560" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">развязка</text>

      <!-- LV мост -->
      <rect x="836" y="76" width="244" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="76" width="244" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="844" y="82" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="91" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PWR</text>
      <text x="958" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LV мост ×2</text>
      <text x="958" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8×MOSFET, LM5101/SI8271×2</text>
      <text x="958" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">42–58 В DC</text>

      <!-- Вспомогательное питание (standalone, unzoned) -->
      <rect x="836" y="260" width="244" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="260" width="244" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
      <rect x="844" y="266" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="275" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PWR</text>
      <text x="958" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Вспом. питание</text>
      <text x="958" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BL9362 → TL431 → 3.3В</text>

      <!-- MCU (focal / accent) -->
      <rect x="176" y="404" width="200" height="132" rx="6" fill="#f5f5f5"/>
      <rect x="176" y="404" width="200" height="132" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="184" y="410" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="200" y="419" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCU</text>
      <text x="276" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CH32V303</text>
      <text x="276" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">основной контроллер</text>
      <text x="276" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ADC · PWM · CAN</text>

      <!-- Изолятор -->
      <rect x="560" y="416" width="160" height="108" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="416" width="160" height="108" rx="6" fill="rgba(45,49,66,0.05)" stroke="#7a8399" stroke-width="1"/>
      <rect x="568" y="422" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="584" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ISO</text>
      <text x="640" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Изолятор</text>
      <text x="640" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">гальваническая развязка</text>

      <!-- CAN-трансивер -->
      <rect x="836" y="416" width="200" height="108" rx="6" fill="#f5f5f5"/>
      <rect x="836" y="416" width="200" height="108" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="844" y="422" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="860" y="431" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUS</text>
      <text x="936" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CAN-трансивер</text>
      <text x="936" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TJA1040</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="592" x2="1120" y2="592" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="608" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="180" y1="604" x2="204" y2="604" stroke="#4f5d75" stroke-width="1.4"/>
      <text x="212" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">силовая цепь</text>

      <line x1="360" y1="604" x2="384" y2="604" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="392" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">данные / CAN</text>

      <line x1="560" y1="604" x2="584" y2="604" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="4,3"/>
      <text x="592" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">управление (ШИМ)</text>

      <rect x="780" y="597" width="14" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="802" y="608" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">основной контроллер</text>

    </svg>
